name: Create GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          source version.properties
          echo "name=$versionName" >> $GITHUB_OUTPUT

      - name: Create GitHub Release from existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"

          # Verify the tag exists (main-ci.yml should have created it)
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Error: Tag $TAG does not exist. Run main-ci.yml first."
            exit 1
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --latest
