name: Main CI

on:
  push:
    branches: [main]

jobs:
  test-and-bump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Run all unit tests
        run: ./gradlew testDebugUnitTest

      - name: Auto bump versionCode
        run: |
          FILE="app/build.gradle.kts"
          CURRENT_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' "$FILE")
          NEW_CODE=$((CURRENT_CODE + 1))
          sed -i "s/versionCode = $CURRENT_CODE/versionCode = $NEW_CODE/" "$FILE"
          echo "Bumped versionCode from $CURRENT_CODE to $NEW_CODE"

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git diff --staged --quiet && echo "No version change to commit" && exit 0
          git commit -m "chore: auto bump versionCode"
          git push
