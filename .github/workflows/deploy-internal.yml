name: Deploy to Internal Testing

on:
  workflow_dispatch:
    inputs:
      deploy_as_draft:
        description: 'Deploy as draft (for new apps)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Create Play Store JSON key
        run: echo "${{ secrets.PLAY_STORE_JSON_KEY }}" | base64 -d > play-store-key.json

      - name: Build and deploy
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEPLOY_AS_DRAFT: ${{ inputs.deploy_as_draft }}
        run: bundle exec fastlane internal

      - name: Clean up secrets
        if: always()
        run: |
          rm -f app/google-services.json
          rm -f app/keystore.jks
          rm -f play-store-key.json
