name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Title edits must not cancel an in-flight test run
  group: pr-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && 'title' || 'code' }}
  cancel-in-progress: true

jobs:
  # The PR title becomes part of the merge commit and drives the version bump.
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          RE='^(feat|feature|fix|bugfix|perf|refactor|chore|docs|test|build|ci|style|revert)(\([^)]+\))?!?: .+'
          if ! echo "$TITLE" | grep -qiE "$RE"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: add budgets', 'fix(loans): rounding', 'feat!: new storage format'"
            exit 1
          fi
          if echo "$TITLE" | grep -qE '^[A-Za-z]+(\([^)]+\))?!:'; then BUMP=major
          elif echo "$TITLE" | grep -qiE '^feat(ure)?'; then BUMP=minor
          else BUMP=patch; fi
          echo "### Version impact: \`$BUMP\`" >> "$GITHUB_STEP_SUMMARY"

  test:
    # Skip re-running tests when only the PR title/body was edited
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve related tests
        id: related
        run: |
          bash .github/scripts/related-tests.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Set up JDK 17
        if: steps.related.outputs.mode != 'none'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Decode google-services.json
        if: steps.related.outputs.mode != 'none'
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Run all unit tests (build config changed)
        if: steps.related.outputs.mode == 'all'
        run: ./gradlew testDebugUnitTest --build-cache

      - name: Run related unit tests
        if: steps.related.outputs.mode == 'filtered'
        run: ./gradlew testDebugUnitTest ${{ steps.related.outputs.filters }} --build-cache

      - name: Compile only (no related tests found)
        if: steps.related.outputs.mode == 'compile'
        run: ./gradlew compileDebugUnitTestKotlin --build-cache

      - name: Skip
        if: steps.related.outputs.mode == 'none'
        run: echo "No code changes detected, skipping tests."

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
