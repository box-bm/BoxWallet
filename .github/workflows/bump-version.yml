name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "New version name (e.g. 1.1.0)"
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Bump versionCode and set versionName
        run: |
          FILE="app/build.gradle.kts"
          # Increment versionCode by 1
          CURRENT_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' "$FILE")
          NEW_CODE=$((CURRENT_CODE + 1))
          sed -i "s/versionCode = $CURRENT_CODE/versionCode = $NEW_CODE/" "$FILE"
          # Set versionName
          sed -i "s/versionName = \".*\"/versionName = \"${{ github.event.inputs.version_name }}\"/" "$FILE"
          echo "Bumped versionCode to $NEW_CODE and versionName to ${{ github.event.inputs.version_name }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "bump/v${{ github.event.inputs.version_name }}"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${{ github.event.inputs.version_name }}"
          git push origin "bump/v${{ github.event.inputs.version_name }}"
